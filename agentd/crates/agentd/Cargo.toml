[package]
name = "agentd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "agentd"
path = "src/main.rs"

[features]
default = []
# Propagate enterprise tool-gate into apexos-plugins + init EE gate at boot.
# Public CI: leave off. Dual-checkout EE: `cargo build -p agentd --features enterprise`
# (and optional `.cargo/config.toml` paths override — docs/enterprise.md).
enterprise = ["apexos-plugins/enterprise", "dep:apexos-ee-dispatch"]

[dependencies]
apexos-core    = { path = "../core" }
apexos-confine = { path = "../../../apexos-confine" }
sha2           = { workspace = true }
apexos-gateway = { path = "../gateway" }
apexos-plugins = { path = "../plugins" }
apexos-agent   = { path = "../agent" }
apexos-store   = { path = "../store" }
# Boot-time init_global_gate only; the supervisor chokepoint lives in plugins.
apexos-ee-dispatch = { path = "../apexos-ee-dispatch", optional = true }
tokio          = { workspace = true }
reqwest        = { workspace = true }   # W2 mesh workers: assign/poll/report POSTs to peers
anyhow         = { workspace = true }
serde_json     = { workspace = true }
serde          = { workspace = true }
toml_edit      = "0.22"
cron           = "0.12"
chrono         = "0.4"
futures-util   = { workspace = true }   # StreamExt for the self-update review gate's LLM call
