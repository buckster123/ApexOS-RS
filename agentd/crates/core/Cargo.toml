[package]
name = "apexos-core"
version = "0.1.0"
edition = "2021"

[dependencies]
apexos-protocol = { path = "../../../apexos-protocol" }
# The ApexNET wire types the router carries (docs/apexnet.md §6.1).
apexos-mesh-proto = { path = "../../../apexos-mesh-proto" }
async-trait       = "0.1"
serde      = { workspace = true }
serde_json = { workspace = true }
tokio      = { workspace = true }
anyhow     = { workspace = true }
image      = { workspace = true }
base64     = { workspace = true }
# Identity store (docs/agent-identity.md): toml persistence + PIN hashing.
toml       = "0.8"
sha2       = { workspace = true }
subtle     = { workspace = true }
rand       = { workspace = true }
# Session-RAG S2: FTS5 overlay on sessions/<id>.jsonl (docs/session-rag.md).
rusqlite   = { workspace = true }
flate2     = "1"
