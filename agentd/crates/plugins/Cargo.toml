[package]
name = "apexos-plugins"
version = "0.1.0"
edition = "2021"

[features]
default = []
# Enterprise tool-gate: path-dep on apexos-ee-dispatch (in-tree public shim by
# default; dual-checkout real ApexOS-Enterprise via Cargo `paths` — docs/enterprise.md).
# Default / public CI builds leave this OFF so EE is never required.
enterprise = ["dep:apexos-ee-dispatch"]

[dependencies]
apexos-core       = { path = "../core" }
apexos-confine    = { path = "../../../apexos-confine" }
# The courier lane (courier.rs) reuses the ApexNET wire crate's crypto
# envelope + blake3 content addressing — one implementation, both transports.
apexos-mesh-proto = { path = "../../../apexos-mesh-proto" }
async-trait       = "0.1"
postcard          = { version = "1.1.3", features = ["alloc"] }
# Optional: EE tool gate (see [features].enterprise). In-tree shim is
# API-compatible with private ApexOS-Enterprise/crates/apexos-ee-dispatch.
apexos-ee-dispatch = { path = "../apexos-ee-dispatch", optional = true }
rand   = { workspace = true }
base64 = { workspace = true }
tokio        = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
anyhow       = { workspace = true }
toml         = "0.8"
toml_edit    = "0.22"
chrono       = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tempfile = { workspace = true }
