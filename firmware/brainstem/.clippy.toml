# esp-generate ships 1024, which is tuned for call stacks on small MCUs. Most
# of what trips it here is not a call stack at all: an `#[embassy_executor::task]`
# function's "frame" is its *future*, allocated once in the static task pool,
# not per-call.
#
# The largest is `radio_task` (~12.7 KB). It owns the HCI packet buffer, builds
# extended-advertising commands, and awaits at a dozen points — and a future is
# sized by the union of everything live across those awaits, so it is much
# larger than any instant of it. The buffers that could sensibly be hoisted
# already live in `Store` (a static) rather than the future.
#
# Budget check, so this is a decision and not a shrug: ~13 KB for the radio
# plus ~2 KB each for five smaller tasks is around 25 KB of task pool, against
# 512 KB of SRAM, 72 KB of which is the heap and 8 KB the BT controller's own
# stack. That is a few percent.
#
# Raised rather than sprinkled with `#[allow]`s so there is one place to reason
# about it. Still a real guard: anything past 16 KB on this target is a design
# question, not a lint to silence.
stack-size-threshold = 16384
