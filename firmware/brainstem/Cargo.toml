[package]
edition      = "2024"
name         = "brainstem"
rust-version = "1.88"
version      = "0.1.0"

[[bin]]
name = "brainstem"
path = "./src/bin/main.rs"

[dependencies]
# The ApexNET wire contract — the SAME crate the Pi bridge and agentd link
# against, compiled here for bare metal (no_std + alloc). One codec, both
# ends of the UART, by construction: a frame the brainstem emits cannot
# drift from what the bridge parses.
apexos-mesh-proto = { path = "../../apexos-mesh-proto", default-features = false, features = ["alloc"] }
embedded-io-async = "0.6"

esp-hal = { version = "~1.1.0", features = ["esp32s3", "unstable"] }

esp-rtos = { version = "0.3.0", features = ["embassy", "esp-alloc", "esp32s3"] }

esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32s3"] }

embassy-executor = { version = "0.10.0", features = [] }
embassy-time = "0.5.0"
embassy-sync = "0.7.0"
# Xtensa has no native 64-bit atomics; portable-atomic provides them via
# critical sections (the ctr/timestamp pair the tasks share).
portable-atomic = { version = "1", features = ["critical-section"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
esp-alloc = "0.10.0"
esp-backtrace = { version = "0.19.0", features = [
  "esp32s3",
  "panic-handler",
  "println",
] }
esp-println = { version = "0.17.0", features = ["esp32s3"] }

critical-section = "1.2.0"
static_cell      = "2.1.1"

# Persistent identity, key, counter high-water and the store-and-forward
# queue. `esp-storage` exposes the on-board flash as embedded-storage traits;
# `sequential-storage` layers wear-levelled map + FIFO queue on top of the
# `apexnet` partition (see partitions.csv). Hand-rolling flash record
# management is how silent corruption gets shipped.
esp-storage        = { version = "0.9.0", features = ["esp32s3"] }
sequential-storage = "8.0.1"
embedded-storage   = "0.3.1"
embassy-embedded-hal = "0.6.0"


# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
